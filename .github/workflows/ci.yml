name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[all,dev]"
      - name: Lint
        run: ruff check src tests
      - name: Test
        run: pytest -q

  docker-sandbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[all]"
      - name: Build sandbox image
        run: sca sandbox build
      - name: Sandbox status
        run: sca sandbox status
      - name: Isolation tests in Docker
        run: pytest -q tests/test_docker_isolation.py
        env:
          SCA_TEST_DOCKER: "1"
